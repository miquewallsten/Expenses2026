<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — OpsFlow</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #09090b; color: rgba(255,255,255,0.92);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 420px; width: 100%; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
      background: #18181b; padding: 28px 24px; }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 18px; font-size: 13px; line-height: 1.55; color: rgba(255,255,255,0.65); }
    button { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; background: #27272a;
      color: white; font-size: 13px; cursor: pointer; }
    button:hover { background: #3f3f46; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; display: inline-block;
      margin-right: 8px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1><span class="dot"></span>Sin conexión</h1>
      <p>No se pudo contactar con el servidor. Revisa tu conexión a internet y vuelve a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </div>
</body>
</html>
