services:

  # ── PostgreSQL 16 (with pgvector) ───────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_ops
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d financial_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (FastAPI + uvicorn) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: "openai"
      LLM_BASE_URL: "https://ollama.com/v1"
      LLM_MODEL: "kimi-k2.6:cloud"
      LLM_API_KEY: "${OLLAMA_API_KEY}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      AUTH_SECRET: ${AUTH_SECRET:-0a2d19310530b99811807426cdd45482da60d3ebe2b3e888a3a75542bd4f017c}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]}
      ARCHIVE_LOCAL_STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - archive_storage:/app/storage
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./requirements.txt:/app/requirements.txt
    command: >  
      sh -c "python scripts/docker_entrypoint.py && 
             python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload --log-level info"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    image: node:20-slim
    working_dir: /app
    
    tmpfs:
      - /app/.next
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    volumes:
      - ./web:/app
      - next_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_DEV_CHEAT: "true"
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # ── Redis (for caching, sessions, Celery broker) ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # ── Celery Worker (background jobs) ────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: "openai"
      LLM_BASE_URL: "https://ollama.com/v1"
      LLM_MODEL: "kimi-k2.6:cloud"
      LLM_API_KEY: "${OLLAMA_API_KEY}"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./requirements.txt:/app/requirements.txt
    command: celery -A packages.core.jobs.celery_app worker -l info

  # ── Celery Beat (periodic task scheduler) ───────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: "openai"
      LLM_BASE_URL: "https://ollama.com/v1"
      LLM_MODEL: "kimi-k2.6:cloud"
      LLM_API_KEY: "${OLLAMA_API_KEY}"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./requirements.txt:/app/requirements.txt 
    command: celery -A packages.core.jobs.celery_app beat -l info

volumes:
  postgres_data:
  archive_storage:
  next_node_modules:
