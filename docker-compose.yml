services:

  # ── PostgreSQL 16 (with pgvector) ───────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_ops
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d financial_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (FastAPI + uvicorn) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
      # Ollama runs on the host Mac — host.docker.internal resolves on OrbStack
      # & Docker Desktop. Hardcoded here (no ${} substitution) so a native-dev
      # .env pointing at 127.0.0.1 can't leak into containers.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v3.1:671b-cloud}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      AUTH_SECRET: ${AUTH_SECRET:-0a2d19310530b99811807426cdd45482da60d3ebe2b3e888a3a75542bd4f017c}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]}
      ARCHIVE_LOCAL_STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - archive_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEV_CHEAT: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

  # ── Redis (for caching, sessions, Celery broker) ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  # ── Celery Worker (background jobs) ────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v3.1:671b-cloud}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
    command: celery -A packages.core.jobs.celery_app worker -l info

  # ── Celery Beat (periodic task scheduler) ───────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-changeme}@db:5432/financial_ops
      REDIS_URL: redis://redis:6379/0
    command: celery -A packages.core.jobs.celery_app beat -l info

volumes:
  postgres_data:
  archive_storage:
