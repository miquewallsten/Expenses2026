<!DOCTYPE html>
<html>
<head>
    <title>Complete Super Admin Flow Test</title>
    <script>
        async function testCompleteFlow() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // 1. Get authentication token
                resultDiv.innerHTML += '\n1. Getting authentication token...';
                const authResponse = await fetch('http://localhost:8001/auth/superadmin-direct?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwiZW1haWwiOiJzdXBlcmFkbWluQGV4YW1wbGUuY29tIiwiY29tcGFueV9pZCI6MSwiZXhwIjoxNzc3NTEwMTY0LCJpc3MiOiJmaW5hbmNpYWwtb3BzLXBsYXRmb3JtIiwiYXVkIjoiZmluYW5jaWFsLW9wcy1wbGF0Zm9ybSJ9.DjXBOcbHf27MLky-CDrJfV2OGDJ27rwY2zGdjHjfDzI');
                const authData = await authResponse.json();
                
                if (!authData.token) {
                    throw new Error('No token received');
                }
                resultDiv.innerHTML += ' ✅';
                
                // 2. Store session
                resultDiv.innerHTML += '\n2. Storing session...';
                localStorage.setItem('session', JSON.stringify(authData));
                resultDiv.innerHTML += ' ✅';
                
                // 3. Verify session storage
                resultDiv.innerHTML += '\n3. Verifying session...';
                const storedSession = JSON.parse(localStorage.getItem('session') || '{}');
                
                if (!storedSession.isSuperAdmin) {
                    throw new Error('isSuperAdmin not set correctly');
                }
                resultDiv.innerHTML += ' ✅';
                
                // 4. Test API access
                resultDiv.innerHTML += '\n4. Testing API access...';
                const apiResponse = await fetch('http://localhost:3000/api/me', {
                    headers: {
                        'Authorization': `Bearer ${storedSession.token}`
                    }
                });
                
                if (!apiResponse.ok) {
                    throw new Error('API access failed');
                }
                resultDiv.innerHTML += ' ✅';
                
                // 5. Test Super Admin portal access
                resultDiv.innerHTML += '\n5. Testing portal access...';
                const portalResponse = await fetch('http://localhost:3000/super-admin', {
                    headers: {
                        'Authorization': `Bearer ${storedSession.token}`
                    }
                });
                
                if (portalResponse.redirected) {
                    resultDiv.innerHTML += ' ❌ Redirected (check console)';
                    console.log('Redirect URL:', portalResponse.url);
                } else {
                    resultDiv.innerHTML += ' ✅';
                }
                
                resultDiv.innerHTML += '\n\n🎉 Flow completed! You can now:';
                resultDiv.innerHTML += '\n• Open Super Admin portal: http://localhost:3000/super-admin';
                resultDiv.innerHTML += '\n• Use quick admin commands: ./quick_admin status';
                
            } catch (error) {
                resultDiv.innerHTML += '\n❌ Error: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <h1>Super Admin Complete Flow Test</h1>
    <button onclick="testCompleteFlow()">Run Complete Test</button>
    <div id="result" style="white-space: pre-wrap; font-family: monospace; margin-top: 20px;"></div>
</body>
</html>
