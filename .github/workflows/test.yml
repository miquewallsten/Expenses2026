name: Test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: i18n key-set parity (es ↔ en)
        run: npm run i18n:check:parity
      - name: i18n full check (parity + t() reference resolution)
        run: npm run i18n:check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/
      - name: prod-preflight (Settings under ENVIRONMENT=production)
        env:
          ENVIRONMENT: production
          AUTH_SECRET: ci-preflight-smoke-secret-must-be-32-or-more-chars-yes
          DEBUG: "false"
          DATABASE_URL: postgresql://prod-db.internal:5432/foplat
          CORS_ORIGINS: '["https://app.foplat.com"]'
          WEB_BASE_URL: https://app.foplat.com
        run: python3 scripts/prod_preflight.py
