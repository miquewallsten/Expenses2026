<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ subject | default("Notification") }}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #e4e4e7;
        line-height: 1.5;
      }
      .wrapper { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
      .card {
        background: #27272a;
        border: 1px solid #3f3f46;
        border-radius: 8px;
        padding: 28px 32px;
      }
      h1 { font-size: 18px; font-weight: 600; color: #fafafa; margin: 0 0 16px; }
      p  { font-size: 14px; color: #d4d4d8; margin: 0 0 12px; }
      .meta { font-size: 12px; color: #a1a1aa; }
      .btn {
        display: inline-block;
        background: #4f46e5;
        color: #ffffff !important;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      .btn-secondary {
        display: inline-block;
        background: transparent;
        color: #a5b4fc !important;
        text-decoration: none;
        padding: 10px 18px;
        border: 1px solid #4f46e5;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        margin-left: 8px;
      }
      .footer {
        margin-top: 24px;
        font-size: 11px;
        color: #71717a;
        text-align: center;
      }
      .data {
        background: #18181b;
        border: 1px solid #3f3f46;
        border-radius: 6px;
        padding: 12px 14px;
        font-size: 13px;
        margin: 16px 0;
      }
      .data dt { color: #a1a1aa; font-weight: 400; display: inline-block; min-width: 110px; }
      .data dd { color: #fafafa; display: inline; margin: 0; }
      .row { margin: 4px 0; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        {% block footer %}
          {{ footer_text | default("Financial Ops Platform") }}
        {% endblock %}
      </div>
    </div>
  </body>
</html>
